[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "xjtu-sy-tcc"
version = "0.1.0"
description = "Reproducible predictive-maintenance experiments using the XJTU-SY bearing dataset"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "PyYAML>=6.0.1",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "psutil>=6.0",
    "scikit-learn>=1.5",
    "ruptures>=1.1.9",
    "torch>=2.7",
]

[project.scripts]
xjtu-sy-audit = "xjtu_sy_tcc.cli.audit:main"
xjtu-sy-build-features = "xjtu_sy_tcc.cli.features:main"
xjtu-sy-run-phase3 = "xjtu_sy_tcc.cli.phase3:main"
xjtu-sy-run-phase4 = "xjtu_sy_tcc.cli.phase4:main"
xjtu-sy-run-phase5 = "xjtu_sy_tcc.cli.phase5:main"
xjtu-sy-run-phase6 = "xjtu_sy_tcc.cli.phase6:main"
xjtu-sy-run-phase7 = "xjtu_sy_tcc.cli.phase7:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
